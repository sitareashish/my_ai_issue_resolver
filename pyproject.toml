[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-issue-resolver"
version = "1.0.0"
description = "Autonomous multi-agent GitHub Issue → PR pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-core>=0.2.0",
    "langsmith>=0.1.0",
    "anthropic>=0.30.0",
    "qdrant-client>=1.10.0",
    "openai>=1.35.0",
    "PyGithub>=2.3.0",
    "gitpython>=3.1.43",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-typescript>=0.22.0",
    "tree-sitter-go>=0.22.0",
    "docker>=7.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "orjson>=3.10.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "responses>=0.25.0",
    "freezegun>=1.5.0",
]

[project.scripts]
resolver    = "src.main:main"
resolver-api = "src.api.server:run"
indexer     = "src.indexer.cli:main"
evaluate    = "scripts.evaluate:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
